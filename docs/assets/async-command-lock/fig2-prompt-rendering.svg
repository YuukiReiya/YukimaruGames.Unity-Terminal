<svg viewBox="0 0 1000 470" role="img"
           aria-label="Before ではプロンプトの直後にローディングスピナーを追加描画していたため『$|』のように連結しユーザー入力のように見えた。After ではプロンプトとローディング表現を排他的に切り替え、さらにスピナーのフレーム文字列を ITerminalOptions.LoadingIndicatorFrames としてインスペクターから設定できるようにした。"><style>text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1b2430;}text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}text.dim{fill:#5b6675;}text.faint{fill:#8894a1;}line.life{stroke:#8894a1;stroke-opacity:0.4;}rect.lane{fill:#f4f6f8;stroke:#d7dde4;}</style><rect x="-40" y="-40" width="2000" height="2000" fill="#ffffff"></rect>
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
          </marker>
        </defs>

        <!-- idle bar -->
        <text x="30" y="30" font-size="13" font-weight="650">Idle</text>
        <rect x="30" y="42" width="300" height="52" rx="8" fill="#f4f6f8" stroke="#d7dde4"></rect>
        <text x="50" y="74" class="mono" font-size="15">$&#160;</text>
        <rect x="70" y="60" width="2" height="18" fill="#5b6675"></rect>
        <text x="30" y="112" font-size="11.5" class="faint">実行開始前 — Before / After で違いなし</text>

        <!-- split arrows -->
        <line x1="330" y1="68" x2="400" y2="68" stroke="currentColor" stroke-opacity="0.3"></line>
        <path d="M400,68 C440,68 440,100 480,100" fill="none" stroke="currentColor" stroke-opacity="0.3"></path>
        <path d="M400,68 C440,68 440,290 480,290" fill="none" stroke="currentColor" stroke-opacity="0.3"></path>
        <text x="336" y="58" font-size="11" class="dim">コマンド実行中…</text>

        <!-- BEFORE executing bar -->
        <text x="480" y="86" font-size="13" font-weight="650" fill="#c1531f">Before — 実行中（連結表示）</text>
        <rect x="480" y="100" width="330" height="52" rx="8" fill="rgba(193, 83, 31, 0.12)" stroke="#c1531f" stroke-opacity="0.5"></rect>
        <text x="500" y="132" class="mono" font-size="15" fill="#c1531f">$</text>
        <text x="518" y="132" class="mono" font-size="15" fill="#c1531f">|</text>
        <rect x="536" y="118" width="2" height="18" fill="#c1531f" opacity="0.6"></rect>
        <text x="480" y="172" font-size="12" fill="#c1531f">プロンプトの直後にスピナーを追加描画 → 「$|」と連結し、ユーザー入力のように見える</text>

        <!-- AFTER executing bar -->
        <text x="480" y="276" font-size="13" font-weight="650" fill="#0f8a7c">After — 実行中（排他表示）</text>
        <rect x="480" y="290" width="330" height="52" rx="8" fill="rgba(15, 138, 124, 0.10)" stroke="#0f8a7c" stroke-opacity="0.5"></rect>
        <text x="500" y="322" class="mono" font-size="15" fill="#0f8a7c">/</text>
        <rect x="536" y="308" width="2" height="18" fill="#0f8a7c" opacity="0.6"></rect>
        <text x="480" y="362" font-size="12" fill="#0f8a7c">実行中はプロンプトの代わりにローディング表現のみを描画（排他）</text>

        <!-- inspector config box feeding into after -->
        <rect x="480" y="392" width="330" height="62" rx="8" fill="#f4f6f8" stroke="#d7dde4"></rect>
        <text x="498" y="412" font-size="11.5" class="mono dim">ITerminalOptions.LoadingIndicatorFrames</text>
        <text x="498" y="432" font-size="13" class="mono">[ "|", "/", "-", "\\" ]&#160;<tspan class="dim" font-size="11">（デフォルト・Inspectorで編集可）</tspan></text>
        <line x1="645" y1="392" x2="645" y2="342" stroke="#0f8a7c" marker-end="url(#arrow2)"></line>
      </svg>